name: Docker Build and Push

on:
  workflow_call:
    inputs:
      platforms:
        description: Comma-separated list of target platforms for buildx
        required: false
        type: string
        default: linux/amd64,linux/arm64
      is_release:
        description: Whether this is a release build
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: Software version
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build number can be derived from the commit count.
          fetch-depth: 0
      - id: version
        name: Get version
        run: |
          base=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' software/EPaperDashboard/EPaperDashboard.csproj | tr -d '[:space:]')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "base_version=$base" >> "$GITHUB_OUTPUT"
          # Commit count is shared by dev and release builds of the same commit, unlike the
          # per-workflow run number, so a release continues the dev build sequence.
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  rendering-component:
    needs: version
    uses: ./.github/workflows/playwright-component-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      image_tag: ${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit
    permissions:
      contents: read

  build-and-push:
    needs: [version, rendering-component]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: izdevdigital/e-paper-dashboard
          tags: type=raw,value=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./software
          file: ./software/EPaperDashboard/Dockerfile
          target: final
          platforms: ${{ inputs.platforms }}
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_CONFIGURATION=Release
            COMPONENT_IMAGE=${{ needs.rendering-component.outputs.image }}
      - name: Extract add-on image metadata
        id: addon-metadata
        uses: docker/metadata-action@v5
        with:
          images: izdevdigital/izboard-addon
          tags: type=raw,value=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
      # Home Assistant add-on variant; reuses the cached stages of the build above.
      - name: Build and push add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./software
          file: ./software/EPaperDashboard/Dockerfile
          target: addon
          platforms: ${{ inputs.platforms }}
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.addon-metadata.outputs.tags }}
          labels: ${{ steps.addon-metadata.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_CONFIGURATION=Release
            COMPONENT_IMAGE=${{ needs.rendering-component.outputs.image }}
            ADDON_VERSION=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
