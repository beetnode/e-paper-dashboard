name: Docker Build and Push

on:
  workflow_call:
    inputs:
      platforms:
        description: Comma-separated list of target platforms for buildx
        required: false
        type: string
        default: linux/amd64,linux/arm64
      is_release:
        description: Whether this is a release build
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: Software version
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      component_tag: ${{ steps.version.outputs.component_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build number can be derived from the commit count.
          fetch-depth: 0
      - id: version
        name: Get version
        run: |
          base=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' software/EPaperDashboard/EPaperDashboard.csproj | tr -d '[:space:]')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "base_version=$base" >> "$GITHUB_OUTPUT"
          # Commit count is shared by dev and release builds of the same commit, unlike the
          # per-workflow run number, so a release continues the dev build sequence.
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Releases get a retained, version-addressed component; development builds share one
          # mutable release that is replaced on every build, like the dev release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "component_tag=rendering-v$version" >> "$GITHUB_OUTPUT"
          else
            echo "component_tag=rendering-latest" >> "$GITHUB_OUTPUT"
          fi

  rendering-component:
    needs: version
    uses: ./.github/workflows/playwright-component-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  publish-component:
    needs: [version, rendering-component]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Serialize master builds replacing the shared rendering-latest release.
    concurrency:
      group: publish-${{ needs.version.outputs.component_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rendering-component-*
          path: component-artifacts
          merge-multiple: true
      - name: Publish component before the application image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT_VERSION: ${{ needs.version.outputs.version }}
          COMPONENT_TAG: ${{ needs.version.outputs.component_tag }}
        run: |
          if [ "$COMPONENT_TAG" = "rendering-latest" ]; then
            gh release delete "$COMPONENT_TAG" --cleanup-tag --yes || echo "No existing $COMPONENT_TAG release to delete"
            gh release create "$COMPONENT_TAG" component-artifacts/* \
              --target "$GITHUB_SHA" --title "Rendering component (latest development build)" \
              --notes "Optional rendering component for development build $COMPONENT_VERSION. Replaced on every master build." \
              --prerelease --latest=false
          elif gh release view "$COMPONENT_TAG" >/dev/null 2>&1; then
            # A rerun must never replace an existing version's downloadable payload.
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$COMPONENT_TAG" --jq '.object.sha')
            test "$commit" = "$GITHUB_SHA"
            echo "Keeping existing component release $COMPONENT_TAG"
          else
            gh release create "$COMPONENT_TAG" component-artifacts/* \
              --target "$GITHUB_SHA" --title "Rendering component $COMPONENT_VERSION" \
              --notes "Optional rendering component for application release $COMPONENT_VERSION." \
              --prerelease --latest=false
          fi

  build-and-push:
    needs: [version, rendering-component, publish-component]
    if: |
      always() && needs.version.result == 'success' &&
      needs.rendering-component.result == 'success' &&
      (needs.publish-component.result == 'success' || needs.publish-component.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: izdevdigital/e-paper-dashboard
          tags: type=raw,value=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./software
          file: ./software/EPaperDashboard/Dockerfile
          target: final
          platforms: ${{ inputs.platforms }}
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_CONFIGURATION=Release
            COMPONENT_RELEASE_TAG=${{ needs.version.outputs.component_tag }}
      - name: Extract add-on image metadata
        id: addon-metadata
        uses: docker/metadata-action@v5
        with:
          images: izdevdigital/izboard-addon
          tags: type=raw,value=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
      # Home Assistant add-on variant; reuses the cached stages of the build above.
      - name: Build and push add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./software
          file: ./software/EPaperDashboard/Dockerfile
          target: addon
          platforms: ${{ inputs.platforms }}
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.addon-metadata.outputs.tags }}
          labels: ${{ steps.addon-metadata.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_CONFIGURATION=Release
            COMPONENT_RELEASE_TAG=${{ needs.version.outputs.component_tag }}
            ADDON_VERSION=${{ inputs.is_release && needs.version.outputs.base_version || 'latest' }}
