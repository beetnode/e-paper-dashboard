name: Firmware Build

on:
  workflow_call:
    outputs:
      version:
        description: 'Firmware version'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history so the build number can be derived from the commit count.
        fetch-depth: 0
      
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
          
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Build firmware
      working-directory: ./firmware
      run: pio run
      
    - name: Get firmware version and build number
      id: version
      run: |
        # Extract FIRMWARE_VERSION from version.h
        FW_VERSION=$(grep 'FIRMWARE_VERSION' firmware/src/version.h | sed 's/.*"\([0-9.]*\)".*/\1/')
        # Commit count matches across dev and release builds of the same commit
        BUILD_NUMBER=$(git rev-list --count HEAD)
        VERSION="$FW_VERSION.$BUILD_NUMBER"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Firmware version: $VERSION"
        
    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp firmware/.pio/build/esp32dev/firmware.bin artifacts/firmware-${{ steps.version.outputs.version }}.bin
        cp firmware/.pio/build/esp32dev/firmware.elf artifacts/firmware-${{ steps.version.outputs.version }}.elf
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-esp32-${{ steps.version.outputs.version }}
        path: artifacts/
        retention-days: 90
