name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # Build all components
  build-firmware:
    uses: ./.github/workflows/firmware-build.yml
    
  build-software:
    uses: ./.github/workflows/docker-build.yml
    with:
      is_release: true
    secrets: inherit
    permissions:
      contents: write
      
  build-packaging:
    uses: ./.github/workflows/freecad-export.yml
    
  # Create unified release with all artifacts
  create-release:
    needs: [build-firmware, build-software, build-packaging]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get tag version
      id: tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"
        
    - name: Download firmware artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-esp32-${{ needs.build-firmware.outputs.version }}
        path: ./release/firmware/
        
    - name: Download STL artifacts
      uses: actions/download-artifact@v4
      with:
        name: freecad-stl-files
        path: ./release/stl/

    - name: Download rendering component artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: rendering-component-*
        path: ./release/rendering/
        merge-multiple: true

    - name: Create versioned artifact zips
      run: |
        mkdir -p release
        cd release
        VERSION=${{ steps.tag.outputs.version }}
        if [ -d firmware ]; then
          zip -r ../firmware-${VERSION}.zip firmware
        else
          echo "No firmware artifacts found"
        fi
        if [ -d stl ]; then
          zip -r ../stl-${VERSION}.zip stl
        else
          echo "No stl artifacts found"
        fi
        cd ..
        
    - name: Create release body
      id: release_body
      run: |
        cat > release_body.md << 'EOF'
        ## Docker Image
        
        ```bash
        docker pull izdevdigital/e-paper-dashboard:${{ steps.tag.outputs.version }}
        ```
        
        [View on Docker Hub](https://hub.docker.com/r/izdevdigital/e-paper-dashboard)
        
        Home Assistant add-on image: `izdevdigital/izboard-addon:${{ steps.tag.outputs.version }}`
        
        ---
        
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Release ${{ steps.tag.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
        generate_release_notes: true
        body_path: release_body.md
        files: |
          firmware-${{ steps.tag.outputs.version }}.zip
          stl-${{ steps.tag.outputs.version }}.zip
          release/rendering/rendering-component-linux-x64.tar.gz
          release/rendering/rendering-component-linux-x64.tar.gz.sha256
          release/rendering/rendering-component-linux-arm64.tar.gz
          release/rendering/rendering-component-linux-arm64.tar.gz.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Release Summary
      run: |
        echo "### ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Firmware (ESP32) — attached as release/firmware.zip" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Docker Image: \`izdevdigital/e-paper-dashboard:${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Add-on Image: \`izdevdigital/izboard-addon:${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Optional rendering components (amd64 + arm64)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 3D Models (STL) — attached as release/stl.zip" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Complete Package (ZIP)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Links:" >> $GITHUB_STEP_SUMMARY
        echo "- 🔗 [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
        echo "- 🐳 [Docker Hub](https://hub.docker.com/r/izdevdigital/e-paper-dashboard)" >> $GITHUB_STEP_SUMMARY
