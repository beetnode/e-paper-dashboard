name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_firmware:
        description: 'Build firmware'
        type: boolean
        default: true
      build_software:
        description: 'Build software (Docker image)'
        type: boolean
        default: true
      build_packaging:
        description: 'Build packaging (STL files)'
        type: boolean
        default: true

jobs:
  # Detect what changed (skip for manual runs)
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      software: ${{ steps.filter.outputs.software }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - '.github/workflows/firmware-build.yml'
            software:
              - 'software/**'
              - '.github/workflows/docker-build.yml'
              - '.github/workflows/dotnet-unit-tests.yml'
              - '.github/workflows/playwright-component-build.yml'
            packaging:
              - 'packaging/**'
              - '.github/workflows/freecad-export.yml'
  
  # Run firmware build if changed or manually selected (or always on master push)
  firmware:
    needs: changes
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.result == 'success') &&
      (github.event_name == 'workflow_dispatch' && inputs.build_firmware || 
       github.event_name == 'push' && github.ref == 'refs/heads/master' ||
       github.event_name != 'workflow_dispatch' && github.event_name != 'push' && needs.changes.outputs.firmware == 'true')
    uses: ./.github/workflows/firmware-build.yml
    
  # Run .NET unit tests if software changed or manually selected (or always on master push)
  software-unit-tests:
    needs: changes
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.result == 'success') &&
      (github.event_name == 'workflow_dispatch' && inputs.build_software ||
       github.event_name == 'push' && github.ref == 'refs/heads/master' ||
       github.event_name != 'workflow_dispatch' && github.event_name != 'push' && needs.changes.outputs.software == 'true')
    uses: ./.github/workflows/dotnet-unit-tests.yml

  # Run software build if changed or manually selected (or always on master push)
  software:
    needs: [changes, software-unit-tests]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.result == 'success') &&
      (needs.software-unit-tests.result == 'skipped' || needs.software-unit-tests.result == 'success') &&
      (github.event_name == 'workflow_dispatch' && inputs.build_software ||
       github.event_name == 'push' && github.ref == 'refs/heads/master' ||
       github.event_name != 'workflow_dispatch' && github.event_name != 'push' && needs.changes.outputs.software == 'true')
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    permissions:
      contents: write
      
  # Run FreeCAD STL export if changed or manually selected (or always on master push)
  packaging:
    needs: changes
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.result == 'success') &&
      (github.event_name == 'workflow_dispatch' && inputs.build_packaging || 
       github.event_name == 'push' && github.ref == 'refs/heads/master' ||
       github.event_name != 'workflow_dispatch' && github.event_name != 'push' && needs.changes.outputs.packaging == 'true')
    uses: ./.github/workflows/freecad-export.yml
  
  # Update development release with latest artifacts
  update-dev-release:
    needs: [firmware, software, packaging]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the build number can be derived from the commit count.
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Delete existing dev release and tag (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete dev --cleanup-tag --yes || echo "No existing dev release to delete"

      - name: Get version info
        id: version
        run: |
          # Get software version
          BASE_VERSION=$(grep '<Version>' software/EPaperDashboard/EPaperDashboard.csproj | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/' | tr -d '[:space:]')
          # Commit count matches the build number used by docker-build.yml and firmware-build.yml
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        
      - name: Download firmware artifacts
        if: needs.firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-${{ needs.firmware.outputs.version }}
          path: ./artifacts/firmware/

      - name: Download STL artifacts
        if: needs.packaging.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: freecad-stl-files
          path: ./artifacts/stl/

      - name: Download rendering component artifacts
        if: needs.software.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: rendering-component-*
          path: ./artifacts/rendering/
          merge-multiple: true

      - name: Create versioned artifact zips
        run: |
          mkdir -p artifacts
          cd artifacts
          VERSION=${{ steps.version.outputs.version }}
          if [ -d firmware ]; then
            zip -r ../firmware-${VERSION}.zip firmware
          else
            echo "No firmware artifacts found"
          fi
          if [ -d stl ]; then
            zip -r ../stl-${VERSION}.zip stl
          else
            echo "No stl artifacts found"
          fi
          cd ..
      - name: Update development release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev
          name: Development Build (Latest)
          draft: false
          prerelease: true
          body: |
            ## 🚧 Development Build
            
            **Latest build from master branch**
            
            - **Commit:** ${{ github.sha }}
            - **Version:** ${{ steps.version.outputs.version }}
            - **Built:** ${{ steps.version.outputs.date }}
            
            ### Docker Image

            ```bash
            # Latest development build
            docker pull izdevdigital/e-paper-dashboard:latest
            ```
            
            [View on Docker Hub](https://hub.docker.com/r/izdevdigital/e-paper-dashboard)
            
            ---
            
            ⚠️ This is an automated development build. For stable releases, see [Releases](https://github.com/${{ github.repository }}/releases).
          files: |
            firmware-${{ steps.version.outputs.version }}.zip
            stl-${{ steps.version.outputs.version }}.zip
            artifacts/rendering/rendering-component-linux-x64.tar.gz
            artifacts/rendering/rendering-component-linux-x64.tar.gz.sha256
            artifacts/rendering/rendering-component-linux-arm64.tar.gz
            artifacts/rendering/rendering-component-linux-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
