name: .NET Unit Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: izboard_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d izboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore software/EPaperDashboard.sln

      - name: Run unit tests
        env:
          TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=izboard_test;Username=postgres;Password=test-only-password
        run: |
          dotnet test software/EPaperDashboard.UnitTests/EPaperDashboard.UnitTests.csproj \
            --configuration Release \
            --no-restore \
            --logger trx \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            software/EPaperDashboard.UnitTests/**/TestResults/**
