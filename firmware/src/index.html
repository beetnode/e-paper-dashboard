<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>izBoard Setup</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .container {
            max-width: 960px;
            margin-right: auto;
            margin-left: auto;
            padding-right: 12px;
            padding-left: 12px;
        }

        .mt-5 {
            margin-top: 3rem !important;
        }

        .text-center {
            text-align: center !important;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            word-wrap: break-word;
            background-color: #fff;
            background-clip: border-box;
            border: 1px solid rgba(0, 0, 0, .125);
            border-radius: .25rem;
        }

        .card-header {
            padding: .75rem 1.25rem;
            margin-bottom: 0;
            background-color: rgba(0, 0, 0, .03);
            border-bottom: 1px solid rgba(0, 0, 0, .125);
            font-weight: 500;
        }

        .card-body {
            flex: 1 1 auto;
            padding: 1.25rem;
        }

        .mb-3 {
            margin-bottom: 1rem !important;
        }

        .form-label {
            margin-bottom: .5rem;
            font-weight: 500;
            display: inline-block;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: .375rem .75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: .25rem;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }

        .form-control:focus {
            color: #212529;
            background-color: #fff;
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 .25rem rgba(13, 110, 253, .25);
        }

        .form-select {
            display: block;
            width: 100%;
            padding: .375rem 2.25rem .375rem .75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: .25rem;
            transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }

        .btn {
            display: inline-block;
            font-weight: 400;
            line-height: 1.5;
            color: #fff;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            background-color: #0d6efd;
            border: 1px solid #0d6efd;
            padding: .375rem .75rem;
            font-size: 1rem;
            border-radius: .25rem;
            transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }

        .btn-primary {
            color: #fff;
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-primary:hover {
            color: #fff;
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .btn-secondary {
            color: #fff;
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-secondary:hover {
            color: #fff;
            background-color: #5c636a;
            border-color: #565e64;
        }

        .w-100 {
            width: 100% !important;
        }

        .d-flex {
            display: flex;
        }

        .gap-2 {
            gap: .5rem;
        }

        .flex-grow-1 {
            flex-grow: 1;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #fff;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: .5rem;
        }

        .icon {
            display: block;
            margin: 0 auto 1rem;
            width: 64px;
            height: 64px;
        }

        .form-text {
            display: block;
            margin-top: .25rem;
            font-size: .875em;
            color: #6c757d;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container mt-5">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
                <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.2" flood-color="#000000" />
                    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.14" flood-color="#000000" />
                </filter>
                <filter id="insetShadow">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
                    <feOffset dx="0" dy="1.5" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3" />
                    </feComponentTransfer>
                </filter>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:white;stop-opacity:0.03" />
                    <stop offset="100%" style="stop-color:black;stop-opacity:0.02" />
                </linearGradient>
                <radialGradient id="highlight" cx="35%" cy="20%" r="65%">
                    <stop offset="0%" style="stop-color:white;stop-opacity:0.02" />
                    <stop offset="100%" style="stop-color:white;stop-opacity:0" />
                </radialGradient>
                <pattern id="scanlines" x="0" y="0" width="2" height="2" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="2" height="1" fill="#000000" opacity="0.02" />
                </pattern>
            </defs>
            <rect x="51" y="64" width="410" height="384" rx="20" fill="#212529" filter="url(#dropShadow)" />
            <rect x="71" y="84" width="370" height="344" rx="8" fill="#f8f9fa" filter="url(#dropShadow)" />
            <rect x="91" y="104" width="90" height="96" rx="4" fill="#084298" filter="url(#dropShadow)" />
            <rect x="91" y="104" width="90" height="96" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="91" y="104" width="90" height="96" rx="4" fill="url(#highlight)" pointer-events="none" />
            <rect x="91" y="212" width="90" height="196" rx="4" fill="#0b5ed7" filter="url(#dropShadow)" />
            <rect x="91" y="212" width="90" height="196" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="91" y="212" width="90" height="196" rx="4" fill="url(#highlight)" pointer-events="none" />
            <rect x="193" y="104" width="134" height="96" rx="4" fill="#0d6efd" filter="url(#dropShadow)" />
            <rect x="193" y="104" width="134" height="96" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="193" y="104" width="134" height="96" rx="4" fill="url(#highlight)" pointer-events="none" />
            <rect x="339" y="104" width="82" height="96" rx="4" fill="#31a8ff" filter="url(#dropShadow)" />
            <rect x="339" y="104" width="82" height="96" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="339" y="104" width="82" height="96" rx="4" fill="url(#highlight)" pointer-events="none" />
            <defs>
                <clipPath id="middleClip">
                    <rect x="193" y="212" width="228" height="96" rx="4" />
                </clipPath>
            </defs>
            <g clip-path="url(#middleClip)" filter="url(#dropShadow)">
                <polygon points="193,212 327,212 277,308 193,308" fill="#75c7ff" />
            </g>
            <rect x="193" y="212" width="228" height="96" rx="4" fill="url(#grad1)" pointer-events="none"
                clip-path="url(#middleClip)" />
            <rect x="193" y="212" width="228" height="96" rx="4" fill="url(#highlight)" pointer-events="none"
                clip-path="url(#middleClip)" />
            <g clip-path="url(#middleClip)" filter="url(#dropShadow)">
                <polygon points="339,212 421,212 421,308 289,308" fill="#54b6ff" />
            </g>
            <rect x="193" y="212" width="228" height="96" rx="4" fill="url(#grad1)" pointer-events="none"
                clip-path="url(#middleClip)" />
            <rect x="193" y="212" width="228" height="96" rx="4" fill="url(#highlight)" pointer-events="none"
                clip-path="url(#middleClip)" />
            <rect x="193" y="320" width="84" height="88" rx="4" fill="#31a8ff" filter="url(#dropShadow)" />
            <rect x="193" y="320" width="84" height="88" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="193" y="320" width="84" height="88" rx="4" fill="url(#highlight)" pointer-events="none" />
            <rect x="289" y="320" width="132" height="88" rx="4" fill="#54b6ff" filter="url(#dropShadow)" />
            <rect x="289" y="320" width="132" height="88" rx="4" fill="url(#grad1)" pointer-events="none" />
            <rect x="289" y="320" width="132" height="88" rx="4" fill="url(#highlight)" pointer-events="none" />
            <rect x="71" y="84" width="370" height="344" rx="8" fill="url(#scanlines)" pointer-events="none" />
        </svg>
        <h2 class="text-center">izBoard Setup</h2>

        <form action="/submit" method="post">
            <div class="card mb-3">
                <div class="card-header">WLAN Setup</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="ssid" class="form-label">Network</label>
                        <div class="d-flex gap-2">
                            <select class="form-select flex-grow-1" name="ssid" id="ssid">
                                <option value="">Scanning...</option>
                            </select>
                            <button type="button" class="btn btn-secondary" id="scanBtn"
                                onclick="scanNetworks()">Scan</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="password"
                            placeholder="Enter password ...">
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">Dashboard</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="server_url" class="form-label">Server address</label>
                        <input type="text" class="form-control" name="server_url" id="server_url"
                            placeholder="e.g. 192.168.1.100:8129">
                        <div class="form-text">As shown in the dashboard when adding a device</div>
                    </div>
                    <div class="mb-3">
                        <label for="pairing_code" class="form-label">Pairing Code</label>
                        <input type="text" class="form-control" name="pairing_code" id="pairing_code"
                            placeholder="Enter pairing code from dashboard ...">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Apply</button>
        </form>
    </div>

    <script>
        function scanNetworks() {
            var btn = document.getElementById('scanBtn');
            var sel = document.getElementById('ssid');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';
            sel.innerHTML = '<option value="">Scanning...</option>';
            fetch('/scan').then(function (r) { return r.json(); }).then(function (networks) {
                sel.innerHTML = '';
                if (networks.length === 0) {
                    sel.innerHTML = '<option value="">No networks found</option>';
                } else {
                    for (var i = 0; i < networks.length; i++) {
                        var opt = document.createElement('option');
                        opt.value = networks[i].ssid;
                        opt.textContent = networks[i].ssid + ' (' + networks[i].rssi + ' dBm)';
                        sel.appendChild(opt);
                    }
                }
                btn.disabled = false;
                btn.textContent = 'Scan';
            }).catch(function () {
                sel.innerHTML = '<option value="">Scan failed</option>';
                btn.disabled = false;
                btn.textContent = 'Scan';
            });
        }
        scanNetworks();
    </script>
</body>

</html>
