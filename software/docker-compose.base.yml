services:
  app:
    image: ${IZBOARD_APP_IMAGE:-izdevdigital/e-paper-dashboard:latest}
    restart: unless-stopped
    ports:
      - "${IZBOARD_WEB_PORT:-8128}:8128"
      - "${IZBOARD_DEVICE_PORT:-8129}:8129"
    environment:
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in software/.env}
      STATE_SIGNING_KEY: ${STATE_SIGNING_KEY:?Set STATE_SIGNING_KEY in software/.env}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:?Set SUPERUSER_USERNAME in software/.env}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Set SUPERUSER_PASSWORD in software/.env}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-litedb}
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:-}
      TZ: ${TZ:-UTC}
    volumes:
      - appdata:/data

volumes:
  appdata:
