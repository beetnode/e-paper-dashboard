      color-20: "#000000"
      color-21: "#FF0000"
      color-22: "#000000"
      color-23: "#FF0000"
      color-24: "#000000"
      color-25: "#FF0000"
      color-26: "#000000"
      color-27: "#FF0000"
      color-28: "#000000"
      color-29: "#FF0000"
